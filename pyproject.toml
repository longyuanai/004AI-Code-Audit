[tool.poetry]
name = "ai-codeguard-upgrade"
version = "0.6.0"
description = "Hybrid TypeScript/Python upgrade layer for AI-CodeGuard"
authors = ["longyuanai"]
license = "MIT"
packages = [
    { include = "analyzer", from = "src" },
    { include = "ai_code_audit", from = "src" },
    { include = "ai_codeguard", from = "src" },
    { include = "codeguard", from = "src" },
    { include = "parser", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
# Sibling-relative, matching every other suite repository. The previous
# "../../" assumed this repo sat one level down inside a local container
# directory; that layout does not exist when CI checks the repo out on its own.
shared-llm-core = { path = "../000shared-llm-core", develop = true }
tree-sitter = ">=0.25,<0.27"
tree-sitter-cpp = "0.23.4"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"

[tool.poetry.group.dev.dependencies]
jsonschema = "^4.26.0"
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
ai-code-audit = "ai_code_audit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["conftest.py", "test_*.py"]
addopts = "--basetemp=.pytest-tmp"
cache_dir = "C:/pytest-cache/004"
