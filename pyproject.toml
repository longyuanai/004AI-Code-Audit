[tool.poetry]
name = "ai-codeguard-upgrade"
version = "0.5.0"
description = "Hybrid TypeScript/Python upgrade layer for AI-CodeGuard"
authors = ["longyuanai"]
license = "MIT"
packages = [
    { include = "analyzer", from = "src" },
    { include = "codeguard", from = "src" },
    { include = "parser", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"
shared-llm-core = { path = "../../000shared-llm-core", develop = true }
tree-sitter = ">=0.25,<0.27"
tree-sitter-python = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
