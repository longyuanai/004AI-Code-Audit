name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

  # Python product tests in two explicit scopes. The Python half of this repo
  # previously had no CI coverage (every workflow ran only npm tests). The
  # single vulnerability-analysis module is an independently versioned
  # repository, checked out at a pinned ref into modules/ exactly as in the
  # local suite layout; shared-llm-core and shared-integration sit next to
  # this repository. The checkout directory is 004AI-Code-Audit because the
  # gateway resolves this product by that name (suite-lock.yml uses it too);
  # under any other name the gateway reports the product unavailable.
  python-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      # C2 store (EnrichmentCacheError, chunked queries): 002AI-Vulnerability-
      # Agent dcb2f29 on agent/commercial-docs (pushed 2026-09-24).
      VULN_MODULE_REF: dcb2f291301129df257bdf48baf90ca694174a39
      SHARED_LLM_CORE_REF: master
      SHARED_INTEGRATION_REF: master
    steps:
      - name: Require a pinned vulnerability-analysis commit
        run: |
          if [ -z "$VULN_MODULE_REF" ]; then
            echo "::error::VULN_MODULE_REF is not pinned: commit and push the C2 store changes of 002AI-Vulnerability-Agent, then set its SHA"
            exit 1
          fi

      - name: Checkout Code Audit
        uses: actions/checkout@v4
        with:
          path: 004AI-Code-Audit

      - name: Checkout shared-llm-core
        uses: actions/checkout@v4
        with:
          repository: longyuanai/000shared-llm-core
          ref: ${{ env.SHARED_LLM_CORE_REF }}
          path: 000shared-llm-core
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      # Required, not continue-on-error: without it the gateway end-to-end
      # tests skip themselves, which is how they went unexecuted in CI.
      - name: Checkout shared-integration
        uses: actions/checkout@v4
        with:
          repository: longyuanai/-000shared-integration
          ref: ${{ env.SHARED_INTEGRATION_REF }}
          path: 000shared-integration
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      - name: Checkout vulnerability-analysis module
        uses: actions/checkout@v4
        with:
          repository: longyuanai/002AI-Vulnerability-Agent
          ref: ${{ env.VULN_MODULE_REF }}
          path: 004AI-Code-Audit/modules/vulnerability-analysis
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # Installed with pip rather than `poetry install` because pyproject
        # declares shared-llm-core as a path dependency. Mirrors the pins in
        # pyproject.toml files; no product package is installed, the runner
        # sets PYTHONPATH to the checked-out sources.
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install
          "pytest>=8.2,<10" "jsonschema>=4.26,<5"
          "tree-sitter>=0.25,<0.27" "tree-sitter-cpp==0.23.4"
          "tree-sitter-python==0.25.0" "tree-sitter-go==0.25.0"
          "tree-sitter-java==0.23.5" "tree-sitter-typescript==0.23.2"
          "httpx>=0.27,<0.28" "pydantic>=2.7,<3" "pyyaml>=6.0.1,<7"
          "tenacity>=8.3,<9" "python-dotenv>=1.0.1,<2" "jinja2>=3.1.4,<4"
          "click>=8.1.7,<9" "rich>=13.7.1,<14" "defusedxml>=0.7.1,<0.8"
          "fastapi>=0.139.2,<0.140.0" "uvicorn>=0.51,<1.0"

      # The gateway (celery, sqlalchemy, ...) and its adapter worker, which runs
      # in a child process that does not inherit PYTHONPATH changes.
      - name: Install shared-integration
        run: python -m pip install ./000shared-integration

      # Fail loudly here rather than letting the gateway tests skip.
      - name: Require the gateway to import
        run: python -c "import shared_integration.gateway"

      - name: Configure git identity for repository fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: Unit scope (product only; integration tests deselected)
        working-directory: 004AI-Code-Audit
        run: python scripts/run_python_tests.py --scope unit

      - name: Integration scope (module required; missing module fails)
        working-directory: 004AI-Code-Audit
        run: python scripts/run_python_tests.py --scope integration

  # The same Python suite on Windows, with the Opengrep binary that
  # OPENGREP.lock pins. The lock pins the Windows asset, so this is the only
  # job where the Opengrep-backed C3 tests can run; everywhere else they skip.
  # The checkout keeps the runner's git defaults, as a local Windows clone
  # would; the next step logs the working-tree line endings it produced.
  # Any skipped test fails the job.
  python-tests-windows:
    name: pytest (Windows, Python 3.12, pinned Opengrep)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VULN_MODULE_REF: dcb2f291301129df257bdf48baf90ca694174a39
      SHARED_LLM_CORE_REF: master
      SHARED_INTEGRATION_REF: master
      OPENGREP_URL: https://github.com/opengrep/opengrep/releases/download/v1.26.0/opengrep_windows_x86.exe
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Code Audit
        uses: actions/checkout@v4
        with:
          path: 004AI-Code-Audit

      - name: Report the checkout's line endings
        working-directory: 004AI-Code-Audit
        run: |
          echo "core.autocrlf=$(git config --get core.autocrlf || echo unset)"
          git ls-files --eol | awk '{print $2}' | sort | uniq -c

      - name: Checkout shared-llm-core
        uses: actions/checkout@v4
        with:
          repository: longyuanai/000shared-llm-core
          ref: ${{ env.SHARED_LLM_CORE_REF }}
          path: 000shared-llm-core
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      - name: Checkout shared-integration
        uses: actions/checkout@v4
        with:
          repository: longyuanai/-000shared-integration
          ref: ${{ env.SHARED_INTEGRATION_REF }}
          path: 000shared-integration
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      - name: Checkout vulnerability-analysis module
        uses: actions/checkout@v4
        with:
          repository: longyuanai/002AI-Vulnerability-Agent
          ref: ${{ env.VULN_MODULE_REF }}
          path: 004AI-Code-Audit/modules/vulnerability-analysis
          token: ${{ secrets.SUITE_CHECKOUT_TOKEN || github.token }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install
          "pytest>=8.2,<10" "jsonschema>=4.26,<5"
          "tree-sitter>=0.25,<0.27" "tree-sitter-cpp==0.23.4"
          "tree-sitter-python==0.25.0" "tree-sitter-go==0.25.0"
          "tree-sitter-java==0.23.5" "tree-sitter-typescript==0.23.2"
          "httpx>=0.27,<0.28" "pydantic>=2.7,<3" "pyyaml>=6.0.1,<7"
          "tenacity>=8.3,<9" "python-dotenv>=1.0.1,<2" "jinja2>=3.1.4,<4"
          "click>=8.1.7,<9" "rich>=13.7.1,<14" "defusedxml>=0.7.1,<0.8"
          "fastapi>=0.139.2,<0.140.0" "uvicorn>=0.51,<1.0"

      - name: Install shared-integration
        run: python -m pip install ./000shared-integration

      - name: Require the gateway to import
        run: python -c "import shared_integration.gateway"

      # Downloaded to the path the tests expect and checked against the lock
      # before anything runs it; the tests verify the digest again.
      - name: Install the pinned Opengrep
        working-directory: 004AI-Code-Audit
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^sha256=//p' benchmarks/phase0/OPENGREP.lock | tr -d '\r')
          target=tools/opengrep/v1.26.0/opengrep.exe
          mkdir -p "$(dirname "$target")"
          curl -fsSL --retry 3 -o "$target" "$OPENGREP_URL"
          actual=$(sha256sum "$target" | cut -d' ' -f1)
          echo "expected=$expected actual=$actual"
          [ -n "$expected" ] && [ "$actual" = "$expected" ]

      - name: Configure git identity for repository fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      # The integration scope is the unit scope plus the vuln_integration
      # tests, so one run covers the whole suite.
      - name: Integration scope
        working-directory: 004AI-Code-Audit
        run: >
          python scripts/run_python_tests.py --scope integration
          tests -q --junitxml="$RUNNER_TEMP/junit-windows.xml"

      - name: Require that no test was skipped
        if: ${{ !cancelled() }}
        run: |
          python - "$RUNNER_TEMP/junit-windows.xml" <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          skipped = [
              f"{case.get('classname')}::{case.get('name')}"
              for case in root.iter("testcase")
              if case.find("skipped") is not None
          ]
          total = sum(1 for _ in root.iter("testcase"))
          print(f"{total} test cases, {len(skipped)} skipped")
          for name in skipped:
              print(f"::error::skipped on Windows: {name}")
          sys.exit(1 if skipped or total == 0 else 0)
          EOF

  # Smoke-tests the composite action itself (action.yml), which the unit
  # suite cannot cover: vulnerable fixtures must yield findings and a valid
  # SARIF file; safe fixtures must yield zero findings and exit 0.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan vulnerable fixtures with the local action
        id: vulnerable
        uses: ./
        with:
          paths: tests/fixtures/vulnerable
          output-file: smoke-vulnerable.sarif
          fail-on-findings: 'false'

      - name: Assert vulnerable scan produced findings and valid SARIF
        env:
          FINDINGS: ${{ steps.vulnerable.outputs.findings-count }}
          SARIF_FILE: ${{ steps.vulnerable.outputs.sarif-file }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS sarif-file=$SARIF_FILE"
          test -f "$SARIF_FILE"
          [ "$FINDINGS" -gt 0 ]
          node -e '
            const sarif = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const driver = sarif.runs?.[0]?.tool?.driver;
            if (sarif.version !== "2.1.0") throw new Error("unexpected SARIF version");
            if (driver?.name !== "AI-CodeGuard") throw new Error("unexpected driver name");
            if (!driver?.version) throw new Error("missing driver version");
            if ((sarif.runs[0].results ?? []).length === 0) throw new Error("no results");
          ' "$SARIF_FILE"

      - name: Scan safe fixtures with the local action (must pass)
        id: safe
        uses: ./
        with:
          paths: tests/fixtures/safe
          output-file: smoke-safe.sarif
          fail-on-findings: 'true'

      - name: Assert safe scan reported zero findings
        env:
          FINDINGS: ${{ steps.safe.outputs.findings-count }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS"
          [ "$FINDINGS" -eq 0 ]
