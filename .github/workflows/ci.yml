name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

  # The Python half of this repo (src/ai_code_audit, src/codeguard,
  # src/ai_codeguard, src/analyzer, src/parser) had no CI coverage at all:
  # every workflow ran only `npm run test:run`, so the pytest suite could sit
  # broken indefinitely. It must keep passing without shared_llm_core and
  # shared_integration, which are unpublished sibling checkouts unavailable
  # here -- tests that genuinely need them skip themselves.
  python-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installed with pip rather than `poetry install` because pyproject
      # declares shared-llm-core as a path dependency on a sibling directory
      # that does not exist in a fresh checkout, which fails resolution.
      # Grammar pins are kept in sync with pyproject by hand.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8.2' \
            'jsonschema>=4.26' \
            'tree-sitter>=0.25,<0.27' \
            'tree-sitter-cpp==0.23.4' \
            'tree-sitter-python==0.25.0' \
            'tree-sitter-go==0.25.0' \
            'tree-sitter-java==0.23.5' \
            'tree-sitter-typescript==0.23.2'

      - name: Configure git identity for repository fixtures
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"

      - name: Run pytest
        run: python -m pytest -q

  # Smoke-tests the composite action itself (action.yml), which the unit
  # suite cannot cover: vulnerable fixtures must yield findings and a valid
  # SARIF file; safe fixtures must yield zero findings and exit 0.
  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan vulnerable fixtures with the local action
        id: vulnerable
        uses: ./
        with:
          paths: tests/fixtures/vulnerable
          output-file: smoke-vulnerable.sarif
          fail-on-findings: 'false'

      - name: Assert vulnerable scan produced findings and valid SARIF
        env:
          FINDINGS: ${{ steps.vulnerable.outputs.findings-count }}
          SARIF_FILE: ${{ steps.vulnerable.outputs.sarif-file }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS sarif-file=$SARIF_FILE"
          test -f "$SARIF_FILE"
          [ "$FINDINGS" -gt 0 ]
          node -e '
            const sarif = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const driver = sarif.runs?.[0]?.tool?.driver;
            if (sarif.version !== "2.1.0") throw new Error("unexpected SARIF version");
            if (driver?.name !== "AI-CodeGuard") throw new Error("unexpected driver name");
            if (!driver?.version) throw new Error("missing driver version");
            if ((sarif.runs[0].results ?? []).length === 0) throw new Error("no results");
          ' "$SARIF_FILE"

      - name: Scan safe fixtures with the local action (must pass)
        id: safe
        uses: ./
        with:
          paths: tests/fixtures/safe
          output-file: smoke-safe.sarif
          fail-on-findings: 'true'

      - name: Assert safe scan reported zero findings
        env:
          FINDINGS: ${{ steps.safe.outputs.findings-count }}
        run: |
          set -euo pipefail
          echo "findings-count=$FINDINGS"
          [ "$FINDINGS" -eq 0 ]
